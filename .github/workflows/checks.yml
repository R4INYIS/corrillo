name: Comprobar Corrillo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      CHROME_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sintaxis y pruebas de lógica, contenido y caché
        run: |
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --test tests/*.test.js
      - name: Preparar navegador de pruebas
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Regresiones de interfaz y uso sin conexión
        run: python tests/regression.py
      - name: Humo de todos los juegos con semilla fija
        run: python tests/smoke.py --seed 20261113 --variants 1 --steps 40
